[project]
name = "ai-researcher"
version = "0.1.0"
description = "Single pane of glass for AI research, product, and model-release trends"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Howard" }]
keywords = ["ai", "news", "dashboard", "rss", "trends", "self-hosted", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "numpy>=1.26",
    "markdown-it-py>=3.0",
]

[project.urls]
Homepage = "https://github.com/l34n/AI-Researcher"
Repository = "https://github.com/l34n/AI-Researcher"
Issues = "https://github.com/l34n/AI-Researcher/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-researcher = "ai_researcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_researcher"]

[tool.hatch.build.targets.wheel.force-include]
"config/sources.yaml" = "ai_researcher/packaged_sources.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: live source contract tests; excluded from the default run",
]
